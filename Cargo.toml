[package]
name = "ghost_sandbox"
version = "1.0.0"
edition = "2021"
description = "Ghost Sandbox — Dynamic Binary Instrumentation, Live Memory Editing, and Universal Hardware Identity Spoofing Framework"
authors = ["Ghost Project"]

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
egui_extras = { version = "0.31" }
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
winapi = { version = "0.3", features = [
    "processthreadsapi", "memoryapi", "handleapi", "synchapi",
    "namedpipeapi", "fileapi", "winbase", "errhandlingapi",
    "securitybaseapi", "libloaderapi", "ioapiset", "winnt",
    "tlhelp32", "debugapi", "psapi", "wow64apiset",
    "sddl", "processenv", "impl-default",
    "winuser", "wingdi", "windef", "minwindef"
] }
chrono = "0.4"
crossbeam-channel = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
csv = "1.3"
open = "5"
rfd = "0.15"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
