name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 1.5.2). Empty = auto-bump minor by 0.1."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 — build, test, package
    runs-on: windows-latest
    timeout-minutes: 90
    # The release step pushes a version-bump commit marked [skip ci]; never
    # build that commit again (also prevents any bump loop).
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write      # push the version bump and publish the release
      id-token: write      # artifact attestations (OIDC)
      attestations: write  # artifact attestations
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # tags are needed for the auto-version calculation

      # Auto-versioning: the version lives in the VERSION file (CI keeps
      # Cargo.toml in sync with it). A push to main bumps the minor version
      # by 0.1 (1.0.0 -> 1.1.0 -> 1.2.0 ...) and publishes a tagged release.
      # To choose a version explicitly, hand-edit VERSION (or the `version`
      # field in Cargo.toml), or run the workflow with the `version` input.
      - name: Resolve version
        id: ver
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $override = "${{ inputs.version }}".Trim()
          $current = if (Test-Path VERSION) {
            (Get-Content VERSION -Raw).Trim()
          } else {
            (
              Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' |
              Select-Object -First 1
            ).Matches[0].Groups[1].Value
          }
          if ($current -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must contain a bare x.y.z version, got '$current'"
          }
          $manifest = (
            Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' |
            Select-Object -First 1
          ).Matches[0].Groups[1].Value
          $tags = @(git tag --list 'v*' |
            ForEach-Object { $_.Substring(1) } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_ })
          $latest = if ($tags.Count -gt 0) { $tags[-1] } else { "" }
          if ($override) {
            $next = $override                                  # explicit dispatch input
          } elseif ($latest -and $current -ne $latest) {
            $next = $current                                   # hand-edited VERSION file
          } elseif ($latest -and $manifest -ne $latest) {
            $next = $manifest                                  # hand-edited Cargo.toml
          } elseif ($latest) {
            $v = [version]$latest
            $next = "{0}.{1}.0" -f $v.Major, ($v.Minor + 1)    # auto-bump minor by 0.1
          } else {
            $next = $current                                   # first release
          }
          if (-not (Test-Path VERSION) -or $current -ne $next) {
            # WriteAllText keeps LF endings (Set-Content would write CRLF).
            [IO.File]::WriteAllText("VERSION", "$next`n")
          }
          if ($manifest -ne $next) {
            $raw = [IO.File]::ReadAllText("Cargo.toml")
            $m = [regex]::Match($raw, '(?m)^version\s*=\s*"[^"]+"')
            if (-not $m.Success) { throw "no version line in Cargo.toml" }
            $patched = $raw.Substring(0, $m.Index) + ('version = "' + $next + '"') + $raw.Substring($m.Index + $m.Length)
            [IO.File]::WriteAllText("Cargo.toml", $patched)
          }
          "next=$next" >> $env:GITHUB_OUTPUT
          Write-Host "release version: $next (VERSION $current, manifest $manifest, latest tag v$latest)"

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The e2e suites run the target\debug\ghost.exe + debug shim, so both
      # profiles are built: debug for the tests, release for the artifact.
      - name: Build host — debug (for the test suites)
        run: cargo build

      - name: Build host — release (GUI, CLI, ghost_lab)
        run: cargo build --release

      - name: Build native shim + fixtures (MSVC)
        run: .\target\release\ghost_lab.exe build all

      - name: Selftest (59 checks)
        run: .\target\release\ghost_lab.exe selftest

      # The GUI suites (drm / sandbox / malware-gui) are local-only. The
      # hardware suite runs headless in CI (GHOST_E2E_HEADLESS drives the
      # same profile/shim path through `ghost run` instead of the GUI).
      - name: End-to-end — CLI, hardware, malware
        env:
          GHOST_E2E_HEADLESS: "1"
        run: |
          .\target\release\ghost_lab.exe e2e cli
          .\target\release\ghost_lab.exe e2e hw
          .\target\release\ghost_lab.exe e2e malware

      - name: Collect test logs on failure
        if: failure()
        shell: pwsh
        run: |
          $dst = "target\drmtest\_logs"
          New-Item -ItemType Directory -Force $dst | Out-Null
          foreach ($p in @(
            (Join-Path $env:TEMP "ghost_sandbox_shim.log"),
            (Join-Path $env:USERPROFILE "AppData\Local\Temp\ghost_sandbox_shim.log")
          )) {
            if (Test-Path $p) { Copy-Item $p $dst -Force }
          }

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            target/drmtest/*.log
            target/drmtest/*.txt
            target/drmtest/*.json
            target/drmtest/*.jsonl
            target/drmtest/_logs/*
          if-no-files-found: ignore

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          $artifacts = @(
            @("target\release\ghost_sandbox.exe", "ghost_sandbox.exe"),
            @("target\release\ghost.exe",         "ghost.exe"),
            @("target\release\ghost_lab.exe",     "ghost_lab.exe"),
            @("target\release\sandbox_shim.dll",  "sandbox_shim.dll"),
            @("sandbox_shim.dll",                 "sandbox_shim.dll"),
            @("target\shimtest\ghost_host.exe",   "ghost_host.exe")
          )
          $copied = @{}
          foreach ($pair in $artifacts) {
            $src = $pair[0]; $name = $pair[1]
            if (-not $copied.ContainsKey($name) -and (Test-Path $src)) {
              Copy-Item $src (Join-Path $dist $name)
              $copied[$name] = $true
            }
          }
          Copy-Item README.md, AGENTS.md, LICENSE $dist
          $files = Get-ChildItem $dist -File | Where-Object { $_.Extension -ne ".zip" -and $_.Name -ne "SHA256SUMS.txt" }
          Compress-Archive -Path $files.FullName -DestinationPath "$dist\ghost-sandbox-windows-x64.zip" -Force
          $hash = (Get-FileHash "$dist\ghost-sandbox-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ghost-sandbox-windows-x64.zip" | Set-Content "$dist\SHA256SUMS.txt"
          Get-ChildItem $dist | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-sandbox-windows-x64
          path: |
            dist/ghost-sandbox-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ghost-sandbox-windows-x64.zip

      - name: Attestation skipped (private repository)
        if: github.event_name != 'pull_request' && github.event.repository.visibility != 'public'
        shell: bash
        run: echo "Artifact attestations require a public repository (or GitHub Enterprise Cloud)."

      # Commit the version bump (when there is one), then publish the tagged
      # release with the attested artifact. `[skip ci]` keeps the bump
      # commit from triggering another run. Reruns are safe: the release is
      # updated in place if it already exists.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.ver.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION Cargo.toml Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): v$env:NEXT [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "version bump commit failed" }
            git push origin "HEAD:${{ github.ref_name }}"
            if ($LASTEXITCODE -ne 0) { throw "version bump push failed" }
          }
          $sha = git rev-parse HEAD
          gh release create "v$env:NEXT" `
            "dist/ghost-sandbox-windows-x64.zip" `
            "dist/SHA256SUMS.txt" `
            --target $sha `
            --title "Ghost Sandbox v$env:NEXT" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release v$env:NEXT already exists; updating assets"
            gh release upload "v$env:NEXT" `
              "dist/ghost-sandbox-windows-x64.zip" `
              "dist/SHA256SUMS.txt" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "release asset update failed" }
          }
          Write-Host "published release v$env:NEXT at $sha"
